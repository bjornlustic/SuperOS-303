; Build: PlatformIO (primary). Arduino IDE 1.8.x + Teensyduino also works:
;   Open src/src.ino, Tools → Board → Teensy++ 2.0, USB Type with Serial if needed, then Verify/Upload.
;   Export a .hex from Arduino (verbose build log path) or use Teensy Loader with a combined HEX from pio run.
;   SysEx for MIDI update: pio run -e app runs tools/makesyx.py → app-update.syx (same packing as tools/hex2sysex.py).
[platformio]
src_dir = src
default_envs = app, bootloader

[env]
custom_project_version = 0.9.9c

[env:app]
framework = arduino
platform = teensy
board = teensy2pp
; avr-gcc 7.3 (same toolchain the d650c emulator core needs for real-time;
; also ~800 B smaller app) and gnu++17: drivers.h uses C++17 inline variables
; so the combined build can share driver state across TUs.
platform_packages = platformio/toolchain-atmelavr @ ~1.70300.0
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
  -std=gnu++17
  -Wl,--section-start=.text=0x0000
  -Wl,--gc-sections
  ; The Teensy AVR core's serial ring indexes are uint8_t, so effective
  ; capacity caps at 256 and available() miscounts above that. 350 left 94
  ; bytes of the array unreachable; 256 is the exact usable maximum.
  -DRX_BUFFER_SIZE=256
  -DTX_BUFFER_SIZE=200
  ; USB MIDI (Phase 1): enumerate as a USB-MIDI device so notes/clock run over USB-C
  ; as well as DIN. On the AT90USB (Teensy 2.0) core, USB type is selected by the
  ; USB_MIDI macro (the combined *_SERIAL types are Teensy 3.x+ only); the usb_midi
  ; core still provides a Serial object, and defining a built-in USB flag suppresses
  ; the default USB_SERIAL (platforms/teensy arduino.py). SUPEROS_USB_MIDI gates the
  ; firmware-side wiring and keeps setup() from tearing USB down.
  -DUSB_MIDI
  -DSUPEROS_USB_MIDI
  ; USB product-string descriptor — overrides the core's #ifndef-guarded default
  ; ("Teensy MIDI") so the device enumerates as "SuperOS-303". Wide-string literal;
  ; descriptor length is sizeof(STR_PRODUCT), so it auto-sizes.
  -DSTR_PRODUCT='L"SuperOS-303"'
  ; Firmware version reported in the SysEx 0x21 config reply (web editor shows it)
  -DSUPEROS_VERSION='"${this.custom_project_version}"'
build_src_filter = +<*> -<bootloader/*> -<flash_diag/*> -<d650/*>
extra_scripts = post:tools/makesyx.py

; Combined SuperOS + D650C-emulator image. One firmware runs per boot,
; selected by the EEPROM byte at 0 (switchable from either FUNCTION+CLEAR
; config menu; see src/combined.h). The d650c side keeps its uPD444 store and
; settings in the internal EEPROM; SuperOS keeps the flash arena (moved up:
; see FE_ARENA_FIRST_PAGE in flash_eeprom.h). Emulator hot files opt into -O3
; via pragma; everything else stays at the platform default -Os.
[env:combined]
extends = env:app
build_src_filter = +<*> -<bootloader/*> -<flash_diag/*>
build_flags =
  ${env:app.build_flags}
  -DSUPEROS_COMBINED
  ; src/d650/emu_avr.cpp includes SuperOS headers as "src/..." (same as the
  ; standalone emulator repo does via -I../SuperOS-303FIRMWARE) and emulator
  ; headers as "emu/...".
  -I.
  -Isrc/d650
  ; linker relaxation (jmp->rjmp etc.): buys headroom below the arena base
  -mrelax -Wl,--relax
  ; Mask-ROM upload: the emulator runs the ROM from a 2 KB SRAM copy loaded from
  ; internal EEPROM; the user can upload their own dump over USB-C or DIN MIDI
  ; SysEx from the web editor (src/d650/rom_store.h). D650_ROM_EMBEDDED keeps the
  ; reconstructed ROM in flash as the boot fallback, so the unit still plays out
  ; of the box and an EEPROM upload overrides it. Drop D650_ROM_EMBEDDED for a
  ; copyright-clean build that ships with no ROM and waits for an upload.
  -DD650_ROM_IN_RAM
  -DD650_ROM_EMBEDDED

; Copyright-clean USB-C build: same as -e combined but WITHOUT the reconstructed
; D650C mask ROM. The emulator boots into upload-wait and runs a ROM the user
; uploads over USB-C or DIN MIDI SysEx (stored in internal EEPROM). SuperOS-303
; works fully regardless. Emits combined-norom-update.syx.
[env:combined-norom]
extends = env:combined
build_flags =
  ${env:combined.build_flags}
  -UD650_ROM_EMBEDDED

; Standalone flash-EEPROM diagnostic (no USB). Builds only src/flash_diag/ +
; headers; reports service-present / raw-write-OK on the keypad LEDs. Emits
; flash-diag-update.syx -- flash like any app update, read the LEDs, then
; reflash -e app.
[env:flash-diag]
extends = env:app
build_src_filter = -<*> +<flash_diag/*>

; SPM flash-write service. Lives at byte 0x1FE00 (pages 0x1FE-0x1FF), the empty
; top of the boot section, well above the running bootloader (pages 0x1F0-0x1F3).
; Build emits service-install.syx (writes only those pages via the existing
; bootloader SysEx updater). Flash via SysEx in bootloader mode; no ISP needed.
[env:flash-service]
build_src_filter = +<flash_service/*>
platform = atmelavr
board_build.mcu = at90usb1286
board_build.f_cpu = 16000000L
framework =
build_flags =
    -Os
    -Wl,--entry=flash_service_entry
    -Wl,--section-start=.service_entry=0x1FE00
    -Wl,--section-start=.text=0x1FE40
extra_scripts =
    pre:tools/flash_service_link.py
    post:tools/make_service_syx.py

[env:bootloader]
build_src_filter = +<bootloader/*>
platform = atmelavr
platform_packages = tool-sreccat
board_build.mcu = at90usb1286
board_build.f_cpu = 4000000L
upload_protocol = teensy-cli ; usbasp          ; <-- change if using Atmel-ICE etc.
framework =
build_flags =
    -Os
    ; reset enters the boot section at its first byte, so the entry stub is
    ; pinned at 0x1F000 and everything else follows (before this, whatever
    ; function the linker placed first was the de-facto entry). The flash
    ; service owns 0x1FE00+; the map is checked after build.
    -Wl,--section-start=.boot_entry=0x1F000
    -Wl,--section-start=.text=0x1F010
    -Wl,--entry=boot_entry
    -nostartfiles
    -nostdlib
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

upload_flags = -p at90usb1286

; Flash bootloader via ISP
upload_command =
    avrdude -c usbasp -p at90usb1286
    -U flash:w:$SOURCE:i

; to merge both hex files
; srec_cat app.hex -Intel bootloader.hex -Intel -o firmware.hex -Intel
extra_scripts = post:tools/merge_firmware.py

[env:fuses]
; Intentionally matches the MSW Vox Dei reference config (chosen after review).
; lfuse 0xDE = 16 MHz crystal (CKDIV8 off), low-power oscillator.
; hfuse 0xDA = SPIEN on, BOOTRST -> Vox Dei bootloader @0x1F000 (BOOTSZ=01).
; efuse 0xF0 = HWBE enabled (as MSW). NOTE: this v1.1 board removed R5 (the HWB
;   pull-up). HWBE-on is benign here: once Vox Dei is flashed it overwrites the
;   factory DFU and BOOTRST controls reset entry, so a floating PE2 can't trap
;   the chip. (The board design / OS-303 use 0xDF/0xDA/0xFC instead; both run.)
platform = atmelavr
board_build.mcu = at90usb1286
upload_protocol = usbasp
upload_command =
    avrdude -c usbasp -p at90usb1286
    -U lfuse:w:0xDE:m
    -U hfuse:w:0xDA:m
    -U efuse:w:0xF0:m
